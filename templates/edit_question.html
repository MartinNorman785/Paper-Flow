{% extends "base.html" %}

{% block title %}PaperFlow View{% endblock %}

{% block content %}
<header>
<body>
    <div class="container">
        <header>
            <h1>Edit Question</h1>
        </header>

        <section>
            <form method="post">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label for="text"><strong>Question Text:</strong></label>
                    <textarea id="text" name="text" style="width: 84.5%">{{ question.text }}</textarea>
                </div>

                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="width: 10%" for="tags"><strong>Tags (Comma Separated):</strong></label>
                    <input style="width: 84.5%" type="text" id="tags" name="tags" value="{{ question.tags }}" placeholder="e.g. algebra, integration, probability">
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button type="submit" >Save Changes</button>
                    <a href="{{ url_for('view_question', question_id=question.id) }}">
                        <button>Back to Question</button>
                    </a>
                </div>
            </form>
        </section>
    </div>
</body>
</html>
{% endblock %}

{% extends "base.html" %}
 
{% block title %}Edit Question — PaperFlow{% endblock %}
 
{% block content %}
<div class="aq-layout">
 
    <!-- Left: form -->
    <div class="aq-form-panel">
 
        <div class="aq-panel-header">
            <a href="{{ url_for('view_question', question_id=question.id) }}" class="back-link">
                ← Back to question
            </a>
            <h2>Edit Question</h2>
        </div>
 
        <div class="aq-panel-body">
 
            <form action="{{ url_for('edit_question', question_id=question.id) }}" method="POST" style="display:contents;">
 
                <div class="form-section">
                    <label for="question_text">Question text</label>
                    <textarea name="question_text" id="question_text" rows="8">{{ question.text }}</textarea>
                </div>
 
                <div class="form-section">
                    <label for="tags">Tags <span style="font-weight:400;text-transform:none;letter-spacing:0;color:#adb5bd;">(comma separated)</span></label>
                    <input type="text" name="tags" id="tags"
                           value="{{ question.tags or '' }}"
                           placeholder="e.g. algebra, integration, probability">
                </div>
 
                <div class="aq-actions">
                    <button type="submit">Save Changes</button>
                    <a href="{{ url_for('view_question', question_id=question.id) }}"
                       
                       onclick="return confirm('Discard changes?')">
                       <button style="background-color:#cd4236;">Cancel</button>
                    </a>
                </div>
 
            </form>
 
        </div>
    </div>
 
    <!-- Right: PDF preview if available -->
    <div class="aq-preview-panel">
        {% if question.filename %}
            <iframe src="{{ url_for('uploaded_question', filename=question.filename) }}"
                    style="flex:1; width:100%; border:none; display:block;"></iframe>
        {% else %}
            <div class="preview-placeholder">
                <p>No PDF attached to this question</p>
            </div>
        {% endif %}
    </div>
 
</div>
{% endblock %}

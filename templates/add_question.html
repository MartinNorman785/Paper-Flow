{% extends "base.html" %}

{% block title %}PaperFlow Add Question{% endblock %}

{% block content %}
<section style="margin: 20px;">
    <h2>Add Question for "{{ paper.filename }}"</h2>

    <form action="{{ url_for('add_question', paper_id=paper.id) }}" method="POST" style="display: flex; flex-direction: column; gap: 10px; max-width: 600px;">
        <label for="question_text">Question Text:</label>
        <textarea name="question_text" id="question_text" rows="5" required placeholder="Enter the question here..." style="padding:5px;"></textarea>

        <label for="question_name">Optional Question Name:</label>
        <input type="text" name="question_name" id="question_name" placeholder="Leave blank to use question text as name" style="padding:5px;">

        <button type="submit" style="padding:8px 12px; background:#007bff; color:white; border:none; border-radius:3px; width:120px;">
            Add Question
        </button>
    </form>

    <div style="margin-top: 10px;">
        <a href="{{ url_for('view_paper', paper_id=paper.id) }}">← Back to Paper</a>
    </div>
</section>
{% endblock %}
